name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Instalar dependencias
        run: flutter pub get
      - name: Análisis de código (Red de seguridad)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Ejecutar pruebas automáticas
        run: flutter test
      - name: Compilar versión Web Release
        run: flutter build web --release
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PITBULL_GYM_100889 }}
          projectId: pitbull-gym-100889
