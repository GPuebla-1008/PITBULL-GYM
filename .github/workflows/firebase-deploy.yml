name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 💙 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🧪 Run Flutter Tests
        run: flutter test

      - name: 🌐 Build Flutter Web Release
        run: flutter build web --release

      - name: 📁 Sync Static Video Assets to Web Directory
        run: |
          mkdir -p build/web/assets/RUTINAS
          mkdir -p build/web/RUTINAS
          mkdir -p build/web/assets/EJERCICIOS_PITBULLGYM
          mkdir -p build/web/EJERCICIOS_PITBULLGYM
          cp -r assets/RUTINAS/* build/web/assets/RUTINAS/ 2>/dev/null || true
          cp -r assets/RUTINAS/* build/web/RUTINAS/ 2>/dev/null || true
          cp -r assets/EJERCICIOS_PITBULLGYM/* build/web/assets/EJERCICIOS_PITBULLGYM/ 2>/dev/null || true
          cp -r assets/EJERCICIOS_PITBULLGYM/* build/web/EJERCICIOS_PITBULLGYM/ 2>/dev/null || true

      - name: 🚀 Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PITBULL_GYM_100889 }}'
          channelId: live
          projectId: pitbull-gym-100889
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
